<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Application Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--surface:#ffffff;--ink:#14213d;--muted:#5d6785;--line:#d5dbe8;--accent:#2f5bea;--accent-ink:#ffffff;--danger:#b04a4a;
  --c-saved:#6b7a99;--c-applied:#2f5bea;--c-interview:#b7791f;--c-offer:#1f8a5b;--c-rejected:#b04a4a;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1524;--surface:#18203a;--ink:#e8ecf8;--muted:#9aa5c4;--line:#2b3556;--accent:#6f8cff;--accent-ink:#0f1524;--danger:#e08a8a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18203a;--ink:#e8ecf8;--muted:#9aa5c4;--line:#2b3556;--accent:#6f8cff;--accent-ink:#0f1524;--danger:#e08a8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em;margin:0 0 4px;line-height:1.05}
.sub{color:var(--muted);margin:0 0 24px;max-width:56ch}
.bar{display:grid;grid-template-columns:1.2fr 1.2fr 1.4fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
input,select,button{font:inherit;color:inherit}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.err{color:var(--danger);font-size:.9rem;margin:8px 2px 0;min-height:1.3em}
.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:14px 0 16px;flex-wrap:wrap}
.search{max-width:320px}
.summary{color:var(--muted);font-size:.95rem}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px}
.col h2{font-size:1rem;font-weight:600;margin:2px 4px 10px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.count{margin-left:auto;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.card b{display:block;font-size:1.02rem}
.role{color:var(--muted);font-size:.93rem}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.82rem;color:var(--muted)}
.meta a{color:var(--accent)}
select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.85rem}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);font-size:.9rem;padding:6px 4px}
@media (max-width:760px){.bar{grid-template-columns:1fr}.board{grid-template-columns:repeat(5,82%)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const STATUSES = ["Saved", "Applied", "Interview", "Offer", "Rejected"];
const COLORS = { Saved: "var(--c-saved)", Applied: "var(--c-applied)", Interview: "var(--c-interview)", Offer: "var(--c-offer)", Rejected: "var(--c-rejected)" };
const SEED = [
  { id: 1, company: "CargoClave", role: "Frontend Developer", link: "", status: "Saved", added: "25 Nov" },
  { id: 2, company: "VE3", role: "Frontend Developer (Intern)", link: "", status: "Saved", added: "25 Nov" },
  { id: 3, company: "Avenirya Solutions", role: "Frontend Developer (0–2 yrs)", link: "", status: "Saved", added: "25 Nov" }
];

function load() {
  try {
    const s = localStorage.getItem("job-tracker-v1");
    if (s) return JSON.parse(s);
  } catch (e) {}
  return SEED;
}

function normalizeLink(v) {
  const t = v.trim();
  if (!t) return "";
  return /^https?:\/\//i.test(t) ? t : "https://" + t;
}

function App() {
  const [jobs, setJobs] = useState(load);
  const [form, setForm] = useState({ company: "", role: "", link: "" });
  const [error, setError] = useState("");
  const [query, setQuery] = useState("");

  useEffect(() => {
    try { localStorage.setItem("job-tracker-v1", JSON.stringify(jobs)); } catch (e) {}
  }, [jobs]);

  const setField = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const addJob = () => {
    if (!form.company.trim() || !form.role.trim()) {
      setError("Enter both a company and a role to add the job.");
      return;
    }
    const added = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    setJobs([{ id: Date.now(), company: form.company.trim(), role: form.role.trim(), link: normalizeLink(form.link), status: "Saved", added }, ...jobs]);
    setForm({ company: "", role: "", link: "" });
    setError("");
  };

  const move = (id, status) => setJobs(jobs.map((j) => (j.id === id ? { ...j, status } : j)));
  const remove = (id) => setJobs(jobs.filter((j) => j.id !== id));

  const q = query.trim().toLowerCase();
  const shown = jobs.filter((j) => !q || (j.company + " " + j.role).toLowerCase().includes(q));
  const applied = jobs.filter((j) => j.status !== "Saved").length;

  return (
    <div className="wrap">
      <h1>Job application tracker</h1>
      <p className="sub">Save roles, move them through each stage, and keep every application in one place. Your list stays in this browser.</p>

      <div className="bar">
        <input aria-label="Company" placeholder="Company" value={form.company} onChange={setField("company")} onKeyDown={(e) => e.key === "Enter" && addJob()} />
        <input aria-label="Role" placeholder="Role" value={form.role} onChange={setField("role")} onKeyDown={(e) => e.key === "Enter" && addJob()} />
        <input aria-label="Job link" placeholder="Job link (optional)" value={form.link} onChange={setField("link")} onKeyDown={(e) => e.key === "Enter" && addJob()} />
        <button className="add" onClick={addJob}>Add job</button>
      </div>
      <div className="err" role="alert">{error}</div>

      <div className="tools">
        <input className="search" aria-label="Search jobs" placeholder="Search by company or role" value={query} onChange={(e) => setQuery(e.target.value)} />
        <span className="summary">{jobs.length} saved · {applied} applied</span>
      </div>

      <div className="board">
        {STATUSES.map((s) => {
          const list = shown.filter((j) => j.status === s);
          return (
            <section className="col" key={s} aria-label={s}>
              <h2><span className="dot" style={{ background: COLORS[s] }}></span>{s}<span className="count">{list.length}</span></h2>
              {list.length === 0 && <div className="empty">Nothing here yet.</div>}
              {list.map((j) => (
                <article className="card" key={j.id} style={{ "--c": COLORS[s] }}>
                  <b>{j.company}</b>
                  <span className="role">{j.role}</span>
                  <div className="meta">
                    <select aria-label={"Move " + j.company + " to another stage"} value={j.status} onChange={(e) => move(j.id, e.target.value)}>
                      {STATUSES.map((o) => <option key={o}>{o}</option>)}
                    </select>
                    {j.link && <a href={j.link} target="_blank" rel="noopener noreferrer">Open posting</a>}
                    <span>{j.added}</span>
                    <button className="del" onClick={() => remove(j.id)} aria-label={"Delete " + j.company}>Delete</button>
                  </div>
                </article>
              ))}
            </section>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
